name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight
  workflow_dispatch: # Allows manual trigger

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to commit files
    steps:
      # 1. MUST checkout the repository first
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Generates the snake SVGs
      - name: Generate Snake Files
        uses: Platane/snk@v3
        with:
          github_user_name: txufiknr
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 3. Pushes the files to the output branch
      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v4 # Updated from v3 to v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
